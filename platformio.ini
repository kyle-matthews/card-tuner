; card-tuner — guitar & bass tuner for the M5Stack Cardputer ADV
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = cardputer

[env:cardputer]
platform = espressif32
board = m5stack-stamps3
framework = arduino
; M5Cardputer >= 1.1.0 is needed for the ADV's I2C (TCA8418) keyboard
lib_deps =
    m5stack/M5Cardputer@^1.1.0
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=1
