; card-tuner — guitar & bass tuner for the M5Stack Cardputer ADV
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = cardputer

[env:cardputer]
platform = espressif32
board = m5stack-stamps3
framework = arduino
; M5Cardputer >= 1.1.0 is needed for the ADV's I2C (TCA8418) keyboard
lib_deps =
    m5stack/M5Cardputer@^1.1.0
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; Route Serial over USB. Without this it goes to UART0 on GPIO43/44,
    ; and GPIO43 is the mic's I2S word-select pin.
    -DARDUINO_USB_CDC_ON_BOOT=1
test_ignore = *

; PC-side unit tests for the hardware-independent code: pio test -e native
; Needs a host C++ compiler (gcc/g++) on PATH.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<pitch.cpp> +<tuning.cpp>
build_flags = -std=gnu++17 -O2
